<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mini Golf</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <h2>MINI GOLF</h2>
  </div>

  <div id="menu" class="overlay active">
    <div class="card">
      <h1>MINI GOLF</h1>
      <p>9 holes · Low-poly course</p>
      <button id="btn-play" class="btn primary">PLAY</button>
      <button id="btn-how" class="btn">HOW TO PLAY</button>
    </div>
  </div>

  <div id="howto" class="overlay">
    <div class="card">
      <h2>How to Play</h2>
      <p><strong>Mouse / Touch</strong> — Drag to aim and set power.<br>
      Release to shoot.<br>
      Ball stops → next shot.</p>
      <button class="btn back" data-back="menu">BACK</button>
    </div>
  </div>

  <div id="hud">
    <div class="stat">Hole <span id="hole">1</span>/9</div>
    <div class="stat">Strokes <span id="strokes">0</span></div>
    <div class="stat">Par <span id="par">3</span></div>
    <div class="stat total">Total <span id="total">0</span></div>
  </div>

  <div id="power-bar">
    <div id="power-fill"></div>
  </div>

  <div id="message" class="overlay">
    <div class="card">
      <h2 id="msg-title">Hole Complete</h2>
      <p id="msg-text"></p>
      <button id="btn-next" class="btn primary">NEXT HOLE</button>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
